[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debilgi"
version = "0.6.0"
description = "A probabilistic, event-driven Discord bot with optional semantic consultation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "cryptography>=44,<47",
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pymorphy3>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
debilgi = "debilgi.main:main"
debilgi-init = "debilgi.local_config:main"
debilgi-replay = "debilgi.simulation:main"
debilgi-secrets = "debilgi.secret_vault:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
