<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEBiLGI · Puter teacher bridge</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101116; color: #f5f5f7; }
    main { width: min(680px, calc(100% - 40px)); padding: 30px; border: 1px solid #2d3040; border-radius: 18px; background: #191b24; box-shadow: 0 20px 60px #0007; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: #b9bdca; line-height: 1.55; }
    button { border: 0; border-radius: 11px; padding: 12px 18px; background: #806cff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    .status { margin-top: 20px; padding: 14px; border-radius: 11px; background: #11131a; white-space: pre-wrap; }
    .ok { color: #72e6a5; } .bad { color: #ff8c9e; } .muted { color: #9297a7; }
    code { color: #d9d2ff; }
  </style>
</head>
<body>
  <main>
    <h1>DEBiLGI · структурный учитель</h1>
    <p>Эта вкладка передаёт фоновые задания браузерному Puter. Инструкция и память хранятся у DEBiLGI; Puter получает её заново для каждого задания и не пишет готовые ответы в Discord.</p>
    <p>Модель: <code>__SEMANTIC_MODEL__</code></p>
    <button id="start" type="button">Запустить мост</button>
    <div id="status" class="status muted">Мост остановлен.</div>
  </main>
  <script>
    const bridgeToken = "__BRIDGE_TOKEN__";
    const clientId = crypto.randomUUID();
    const startButton = document.querySelector("#start");
    const statusBox = document.querySelector("#status");
    let running = false;
    let completed = 0;
    let lastError = null;

    const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

    async function waitForPuter(timeoutMilliseconds = 8000) {
      const deadline = Date.now() + timeoutMilliseconds;
      while (Date.now() < deadline) {
        if (window.puter?.ai?.chat && window.puter?.auth) return true;
        await pause(100);
      }
      return false;
    }

    function show(message, kind = "muted") {
      statusBox.className = `status ${kind}`;
      statusBox.textContent = message;
    }

    function signedIn() {
      try { return Boolean(window.puter?.auth?.isSignedIn()); }
      catch { return false; }
    }

    async function bridgeRequest(path, body) {
      return fetch(path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-DEBiLGI-Bridge": bridgeToken,
        },
        body: JSON.stringify({
          client_id: clientId,
          signed_in: signedIn(),
          status: running ? "ready" : "stopped",
          last_error: lastError,
          ...body,
        }),
      });
    }

    function responseContent(result) {
      const content = result?.message?.content ?? result?.content ?? result;
      if (typeof content === "string") return content;
      if (Array.isArray(content)) return content.map((item) => item?.text || "").join("").trim();
      return String(content ?? "");
    }

    function parseJsonObject(value) {
      const cleaned = String(value ?? "")
        .trim()
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/, "");
      try {
        const parsed = JSON.parse(cleaned);
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : null;
      } catch {
        const start = cleaned.indexOf("{");
        const end = cleaned.lastIndexOf("}");
        if (start < 0 || end <= start) return null;
        try {
          const parsed = JSON.parse(cleaned.slice(start, end + 1));
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : null;
        } catch { return null; }
      }
    }

    async function askPuter(job, repair = false) {
      const repairInstruction = repair
        ? "\nПредыдущий результат был невалидным. Верни полный компактный JSON строго по схеме."
        : "";
      const result = await window.puter.ai.chat(
        [
          { role: "system", content: job.system_prompt + repairInstruction },
          { role: "user", content: JSON.stringify(job.request) },
        ],
        { model: job.model, temperature: 0.1, max_tokens: 4096 },
      );
      return parseJsonObject(responseContent(result));
    }

    async function processJob(job) {
      show(`Изучаю фоновое задание ${job.id.slice(0, 8)}…`, "muted");
      try {
        const parsed = await askPuter(job) ?? await askPuter(job, true);
        if (!parsed) throw new Error("Puter дважды вернул невалидный JSON");
        const response = await bridgeRequest("/v1/bridge/result", {
          id: job.id,
          content: parsed,
        });
        if (!response.ok) throw new Error(`локальный валидатор отклонил результат: HTTP ${response.status}`);
        completed += 1;
        lastError = null;
        show(`Мост работает. Усвоено заданий за эту сессию: ${completed}.`, "ok");
      } catch (error) {
        const message = String(error?.message || error).slice(0, 280);
        lastError = message;
        console.error("Puter bridge job failed", error);
        await bridgeRequest("/v1/bridge/result", { id: job.id, error: message }).catch(() => {});
        show(`Ошибка задания: ${message}\nМост продолжит работу.`, "bad");
      }
    }

    async function poll() {
      while (running) {
        try {
          const response = await bridgeRequest("/v1/bridge/next", {});
          if (response.status === 204) {
            if (completed === 0 && !lastError) {
              show("Мост работает. Жду фоновое задание DEBiLGI…", "ok");
            }
            await pause(850);
            continue;
          }
          if (!response.ok) throw new Error(`sidecar HTTP ${response.status}`);
          await processJob(await response.json());
        } catch (error) {
          show(`Связь с локальным sidecar потеряна: ${String(error?.message || error)}. Повторяю…`, "bad");
          await pause(1800);
        }
      }
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      show("Подключаю браузерную сессию Puter…", "muted");
      try {
        if (!await waitForPuter()) throw new Error("Puter.js не загрузился за 8 секунд");
        if (!signedIn()) {
          await window.puter.auth.signIn({ attempt_temp_user_creation: true });
        }
        if (!signedIn()) throw new Error("Puter не выдал браузерную сессию");
        running = true;
        show("Мост работает. Жду фоновое задание DEBiLGI…", "ok");
        await poll();
      } catch (error) {
        show(`Не удалось запустить мост: ${String(error?.message || error)}`, "bad");
        startButton.disabled = false;
      }
    });
  </script>
</body>
</html>
